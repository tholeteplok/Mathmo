name: iTHUNG Auto Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (misal v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Odometer Version
        id: semver
        run: |
          # 1. Cari tag SemVer terakhir
          LATEST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.1.0"
            COMMIT_COUNT=$(git rev-list HEAD --count)
          else
            COMMIT_COUNT=$(git rev-list "${LATEST_TAG}..HEAD" --count)
          fi

          echo "Latest tag: $LATEST_TAG"
          echo "Commit count since $LATEST_TAG: $COMMIT_COUNT"

          # 2. Tentukan target versi menggunakan Aturan Odometer Basis 10 Rollover
          # (Digit 9 berputar ke 0 dan menambah +1 ke digit di depannya, kecuali angka paling depan)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            NEW_VERSION="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            NEW_VERSION="${{ github.event.inputs.version }}"
          else
            CLEAN_TAG="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-1}
            PATCH=${PATCH:-0}

            # Jalankan simulasi odometer sebanyak jumlah commit baru
            for ((i=0; i<COMMIT_COUNT; i++)); do
              if [ "$PATCH" -ge 9 ]; then
                PATCH=0
                if [ "$MINOR" -ge 9 ]; then
                  MINOR=0
                  MAJOR=$((MAJOR + 1))
                else
                  MINOR=$((MINOR + 1))
                fi
              else
                PATCH=$((PATCH + 1))
              fi
            done

            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          BUILD_NUMBER=$(git rev-list --count HEAD)
          CLEAN_VERSION="${NEW_VERSION#v}"

          echo "Target Version: $NEW_VERSION"
          echo "Clean Version: $CLEAN_VERSION"
          echo "Build Number: $BUILD_NUMBER"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

          # 3. Buat dan push Git Tag baru jika belum ada
          if [ "$NEW_VERSION" != "$LATEST_TAG" ] || [ "$COMMIT_COUNT" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -fa "$NEW_VERSION" -m "Release $NEW_VERSION (Build $BUILD_NUMBER - Odometer Auto Build)"
            git push origin "$NEW_VERSION" --force || echo "Tag push completed or skipped"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Credentials (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            python3 -m json.tool android/app/google-services.json > /dev/null
          else
            echo "::warning ::GOOGLE_SERVICES_JSON secret not set. Make sure to add GOOGLE_SERVICES_JSON in GitHub Repository Secrets."
          fi

      - name: Configure Android Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/ithung_release.jks
          else
            echo "" | base64 -d > android/app/ithung_release.jks
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Build Release APKs (Split per ABI & Universal)
        env:
          BUILD_NAME: ${{ steps.semver.outputs.clean_version }}
          BUILD_NUMBER: ${{ steps.semver.outputs.build_number }}
        run: |
          flutter build apk --release --split-per-abi --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Rename Release Assets
        id: asset_info
        env:
          TAG_NAME: ${{ steps.semver.outputs.new_version }}
        run: |
          OUT="build/app/outputs/flutter-apk"
          
          # Salin & beri nama jelas untuk varian ABI hemat
          cp "$OUT/app-arm64-v8a-release.apk" "$OUT/iTHUNG-${TAG_NAME}-arm64-v8a.apk" || true
          cp "$OUT/app-armeabi-v7a-release.apk" "$OUT/iTHUNG-${TAG_NAME}-armeabi-v7a.apk" || true
          cp "$OUT/app-x86_64-release.apk" "$OUT/iTHUNG-${TAG_NAME}-x86_64.apk" || true
          
          # Salin varian universal fallback
          cp "$OUT/app-release.apk" "$OUT/iTHUNG-${TAG_NAME}-universal.apk" || true
          cp "$OUT/app-release.apk" "$OUT/iTHUNG-${TAG_NAME}.apk" || true

      - name: Generate Friendly Release Notes
        id: notes
        run: |
          LATEST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | sed -n '2p')
          if [ -z "$LATEST_TAG" ]; then
            COMMITS=$(git log -n 5 --pretty=format:"%s")
          else
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s")
          fi

          NOTES=""
          HAS_NOTES=false

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            LOWER=$(echo "$line" | tr '[:upper:]' '[:lower:]')

            if [[ "$LOWER" =~ ^fix ]]; then
              CLEAN=$(echo "$line" | sed -E 's/^fix(\([^)]*\))?:\s*//I')
              NOTES="${NOTES}\n- [FIX] ${CLEAN}"
              HAS_NOTES=true
            elif [[ "$LOWER" =~ ^feat ]]; then
              CLEAN=$(echo "$line" | sed -E 's/^feat(\([^)]*\))?:\s*//I')
              NOTES="${NOTES}\n- [FEAT] ${CLEAN}"
              HAS_NOTES=true
            elif [[ "$LOWER" =~ ^perf ]]; then
              CLEAN=$(echo "$line" | sed -E 's/^perf(\([^)]*\))?:\s*//I')
              NOTES="${NOTES}\n- [PERF] ${CLEAN}"
              HAS_NOTES=true
            elif [[ "$LOWER" =~ ^(ui|style) ]]; then
              CLEAN=$(echo "$line" | sed -E 's/^(ui|style)(\([^)]*\))?:\s*//I')
              NOTES="${NOTES}\n- [UI] ${CLEAN}"
              HAS_NOTES=true
            elif [[ "$LOWER" =~ ^(chore|refactor) ]]; then
              CLEAN=$(echo "$line" | sed -E 's/^(chore|refactor)(\([^)]*\))?:\s*//I')
              NOTES="${NOTES}\n- [GENERAL] ${CLEAN}"
              HAS_NOTES=true
            fi
          done <<< "$COMMITS"

          if [ "$HAS_NOTES" = false ]; then
            NOTES="- [PERF] Peningkatan performa & respon gameplay lebih mulus\n- [FIX] Optimalisasi kestabilan koneksi dan penyimpanan progres\n- [UI] Penyempurnaan kenyamanan visual antarmuka petualangan"
          fi

          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo -e "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.new_version }}
          name: iTHUNG ${{ steps.semver.outputs.new_version }}
          body: ${{ steps.notes.outputs.release_notes }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            build/app/outputs/flutter-apk/iTHUNG-*-arm64-v8a.apk
            build/app/outputs/flutter-apk/iTHUNG-*-armeabi-v7a.apk
            build/app/outputs/flutter-apk/iTHUNG-*-x86_64.apk
            build/app/outputs/flutter-apk/iTHUNG-*-universal.apk
            build/app/outputs/flutter-apk/iTHUNG-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
